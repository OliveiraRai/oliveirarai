<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">MOSS — Status do personagem</title>
  <desc id="desc">Cabeçalho inspirado em menus de RPG pixel art, com uma janela de status escura e detalhes vermelhos.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#26252c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="260" fill="#101015"/>
  <rect width="1000" height="260" fill="url(#grid)"/>
  <!-- pixel corners -->
  <path d="M24 40V24H40V16H960V24H976V40H984V220H976V236H960V244H40V236H24V220H16V40Z" fill="#18171e" stroke="#a34652" stroke-width="3" shape-rendering="crispEdges"/>
  <path d="M40 56H960M40 205H960" stroke="#4b3038" stroke-width="2" shape-rendering="crispEdges"/>
  <rect x="48" y="70" width="10" height="10" fill="#a34652"/>
  <rect x="64" y="70" width="10" height="10" fill="#a34652" opacity=".65"/>
  <rect x="80" y="70" width="10" height="10" fill="#a34652" opacity=".35"/>
  <text x="48" y="116" fill="#e8e3e7" font-family="monospace, monospace" font-size="42" font-weight="700" letter-spacing="5">MOSS</text>
  <text x="50" y="145" fill="#c56a76" font-family="monospace, monospace" font-size="15" letter-spacing="2">STATUS DO PERSONAGEM</text>
  <text x="50" y="181" fill="#b6b1bd" font-family="monospace, monospace" font-size="14">CLASSE: DESENVOLVEDOR EM FORMAÇÃO</text>
  <!-- pixel heart / status icon -->
  <g transform="translate(835 83)" fill="#a34652" shape-rendering="crispEdges">
    <rect x="16" y="0" width="16" height="16"/><rect x="48" y="0" width="16" height="16"/>
    <rect x="0" y="16" width="80" height="16"/><rect x="16" y="32" width="48" height="16"/>
    <rect x="32" y="48" width="16" height="16"/>
  </g>
  <text x="875" y="181" text-anchor="middle" fill="#8f8996" font-family="monospace, monospace" font-size="12">SAVE POINT</text>
  <text x="875" y="197" text-anchor="middle" fill="#c56a76" font-family="monospace, monospace" font-size="12">EM CONSTRUÇÃO</text>
  <rect x="48" y="220" width="10" height="6" fill="#a34652"/>
  <rect x="64" y="220" width="10" height="6" fill="#a34652" opacity=".6"/>
  <rect x="80" y="220" width="10" height="6" fill="#a34652" opacity=".3"/>
  <text x="950" y="228" text-anchor="end" fill="#716b78" font-family="monospace, monospace" font-size="11">PLAYER PROFILE // 001</text>
</svg>
